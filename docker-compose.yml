# One command: docker compose up
services:
  nats:
    image: nats:2          # core pub/sub only; do not enable JetStream
    ports: ["4222:4222"]

  server:
    build: { context: ., dockerfile: deploy/go.Dockerfile, args: { CMD: server } }
    environment: { NATS_URL: "nats://nats:4222", HTTP_ADDR: ":8080" }
    ports: ["8080:8080"]
    depends_on: [nats]

  node-1: &node
    build: { context: ., dockerfile: deploy/go.Dockerfile, args: { CMD: node } }
    environment: { NODE_ID: P1, NATS_URL: "nats://nats:4222" }
    depends_on: [nats]
  node-2:
    <<: *node
    environment: { NODE_ID: P2, NATS_URL: "nats://nats:4222" }
  node-3:
    <<: *node
    environment: { NODE_ID: P3, NATS_URL: "nats://nats:4222" }

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8080" }
    depends_on: [server]
